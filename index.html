<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İTÜ Map - Ayazağa</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    
    /* Gelişmiş, modern kontrol paneli */
    #controlPanel {
      position: absolute;
      top: 15px;
      left: 15px; 
      z-index: 1000;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      width: 290px;
      max-height: 85vh;
      overflow-y: auto;
      transition: all 0.3s ease;
    }
    
    /* Sabit Açma Butonu (Sağ üstte hep duracak) */
    #openMenuBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      background: #ffd700;
      color: black;
      font-weight: bold;
      font-size: 16px;
      border: 2px solid #333;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #333;
      margin-top: -5px;
      margin-right: -5px;
      font-weight: bold;
    }

    /* Sarı arka plan, Siyah yazı tasarımı */
    select { 
      width: 100%; 
      padding: 10px; 
      margin-top: 5px; 
      margin-bottom: 12px; 
      border-radius: 6px; 
      border: 2px solid #333; 
      font-size: 15px; 
      background-color: #ffd700; 
      color: #000; 
      font-weight: bold;
    }
    
    optgroup { background-color: #fff; color: #333; }
    option { background-color: #fff; color: #000; font-weight: normal; }

    button.full-width { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border-radius: 6px; font-size: 15px; }
    
    .btn-route { background: #0033a0; color: white; font-weight: bold; cursor: pointer; border: none; }
    .btn-route:hover { background: #002277; }
    
    .btn-gps { background: #28a745; color: white; font-weight: bold; cursor: pointer; border: none; margin-bottom: 15px; }
    .btn-gps:hover { background: #218838; }
    
    #routeInfo {
      display: none;
      background: #e9ecef;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 15px;
      color: #333;
      text-align: center;
      border: 1px solid #ccc;
    }
    
    /* Orijinal rota tablosunu gizle */
    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>

  <button id="openMenuBtn" onclick="toggleMenu()">🔍 Menüyü Aç</button>

  <div id="controlPanel">
    <button class="close-btn" onclick="toggleMenu()">✖</button>
    <h3 style="margin-top: 0; color: #0033a0; text-align: left; border-bottom: 2px solid #eee; padding-bottom: 10px;">İTÜ Navigasyon</h3>
    
    <button class="btn-gps full-width" onclick="useCurrentLocation()">📍 Konumumu Bul (GPS)</button>

    <label><b>Neredesin? (Başlangıç):</b></label>
    <select id="startSelect">
      <optgroup label="Fakülteler & Derslikler">
        <option value="41.1045,29.0225">Bilgisayar ve Bilişim Fak. (BBF)</option>
        <option value="41.1042,29.0198">Elektrik-Elektronik Fak. (EEB)</option>
        <option value="41.1070,29.0230">Fen Edebiyat Fakültesi (FEF)</option>
        <option value="41.1060,29.0210">Gemi İnşaatı ve Deniz Bil. Fak.</option>
        <option value="41.1092,29.0225">İnşaat Fakültesi</option>
        <option value="41.1065,29.0260">Kimya Metalurji Fak. (KMF)</option>
        <option value="41.1055,29.0270">Maden Fakültesi</option>
        <option value="41.1077,29.0245">Merkezi Derslik (MED)</option>
        <option value="41.1086,29.0255">Uçak ve Uzay Bilimleri Fak.</option>
        <option value="41.1119,29.0229">Yabancı Diller Yüksekokulu (YDY)</option>
      </optgroup>
      <optgroup label="Giriş Kapıları">
        <option value="41.1030,29.0252">Ana Kapı (Metro Çıkışı)</option>
        <option value="41.1080,29.0290">Borsa Kapısı</option>
        <option value="41.1125,29.0240">İstinye Kapısı</option>
      </optgroup>
      <optgroup label="Sosyal Alanlar & Kütüphane">
        <option value="41.1049,29.0210">75. Yıl Öğrenci Merkezi (Yemekhane)</option>
        <option value="41.1085,29.0185">İTÜ Gölet & Kafeler</option>
        <option value="41.1054,29.0234">İTÜ Stadyumu</option>
        <option value="41.1082,29.0229">Mustafa İnan Kütüphanesi</option>
        <option value="41.1038,29.0258">Süleyman Demirel Kültür Merkezi</option>
      </optgroup>
      <optgroup label="Yurtlar">
        <option value="41.1035,29.0230">Ayazağa Kız Yurdu</option>
        <option value="41.1098,29.0195">Gölet Yurtları</option>
        <option value="41.1040,29.0280">Vadi Yurtları</option>
      </optgroup>
    </select>

    <label><b>Nereye Gideceksin? (Hedef):</b></label>
    <select id="endSelect">
      <optgroup label="Fakülteler & Derslikler">
        <option value="41.1045,29.0225">Bilgisayar ve Bilişim Fak. (BBF)</option>
        <option value="41.1042,29.0198">Elektrik-Elektronik Fak. (EEB)</option>
        <option value="41.1070,29.0230">Fen Edebiyat Fakültesi (FEF)</option>
        <option value="41.1060,29.0210">Gemi İnşaatı ve Deniz Bil. Fak.</option>
        <option value="41.1092,29.0225">İnşaat Fakültesi</option>
        <option value="41.1065,29.0260">Kimya Metalurji Fak. (KMF)</option>
        <option value="41.1055,29.0270">Maden Fakültesi</option>
        <option value="41.1077,29.0245">Merkezi Derslik (MED)</option>
        <option value="41.1086,29.0255">Uçak ve Uzay Bilimleri Fak.</option>
        <option value="41.1119,29.0229">Yabancı Diller Yüksekokulu (YDY)</option>
      </optgroup>
      <optgroup label="Giriş Kapıları">
        <option value="41.1030,29.0252">Ana Kapı (Metro Çıkışı)</option>
        <option value="41.1080,29.0290">Borsa Kapısı</option>
        <option value="41.1125,29.0240">İstinye Kapısı</option>
      </optgroup>
      <optgroup label="Sosyal Alanlar & Kütüphane">
        <option value="41.1049,29.0210">75. Yıl Öğrenci Merkezi (Yemekhane)</option>
        <option value="41.1085,29.0185">İTÜ Gölet & Kafeler</option>
        <option value="41.1054,29.0234">İTÜ Stadyumu</option>
        <option value="41.1082,29.0229">Mustafa İnan Kütüphanesi</option>
        <option value="41.1038,29.0258">Süleyman Demirel Kültür Merkezi</option>
      </optgroup>
      <optgroup label="Yurtlar">
        <option value="41.1035,29.0230">Ayazağa Kız Yurdu</option>
        <option value="41.1098,29.0195">Gölet Yurtları</option>
        <option value="41.1040,29.0280">Vadi Yurtları</option>
      </optgroup>
    </select>

    <button class="btn-route full-width" onclick="calculateRoute()">Rotayı Çiz</button>
    
    <div id="routeInfo"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <script>
    // Haritayı İTÜ Ayazağa merkezine odakla
    const map = L.map('map', {zoomControl: false}).setView([41.1065, 29.0235], 16);
    L.control.zoom({position: 'bottomright'}).addTo(map);

    // Yeni, temiz, profesyonel harita görünümü (CartoDB Voyager)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    let routingControl = null;
    let userLocationMarker = null;
    let gpsLat = null;
    let gpsLng = null;

    function toggleMenu() {
      const panel = document.getElementById("controlPanel");
      const btn = document.getElementById("openMenuBtn");
      
      if (panel.style.display === "none") {
        panel.style.display = "block";
        btn.style.display = "none";
      } else {
        panel.style.display = "none";
        btn.style.display = "block";
      }
    }

    function useCurrentLocation() {
      const infoBox = document.getElementById('routeInfo');
      if (navigator.geolocation) {
        infoBox.style.display = "block";
        infoBox.innerHTML = "⏳ Konumunuz bulunuyor...";
        
        navigator.geolocation.getCurrentPosition(function(position) {
          gpsLat = position.coords.latitude;
          gpsLng = position.coords.longitude;
          
          if(userLocationMarker) { map.removeLayer(userLocationMarker); }
          userLocationMarker = L.circleMarker([gpsLat, gpsLng], {color: '#007bff', radius: 8, fillOpacity: 0.8}).addTo(map).bindPopup("Buradasınız!").openPopup();
          map.setView([gpsLat, gpsLng], 17);
          
          let startSelect = document.getElementById("startSelect");
          if(!document.getElementById("currOpt")) {
             let opt = document.createElement('option');
             opt.id = "currOpt";
             opt.value = "current";
             opt.innerHTML = "📍 Anlık Konumum (GPS)";
             startSelect.insertBefore(opt, startSelect.firstChild);
          }
          startSelect.value = "current";
          
          infoBox.innerHTML = "✅ Konum bulundu! Hedef seçip Rotayı Çiz'e basın.";
        }, function(error) {
          infoBox.innerHTML = "❌ Konum alınamadı. Cihaz izinlerini kontrol edin.";
        }, { enableHighAccuracy: true });
      } else {
        alert("Tarayıcınız konum özelliğini desteklemiyor.");
      }
    }

    function calculateRoute() {
      const startValue = document.getElementById("startSelect").value;
      const endVal = document.getElementById("endSelect").value.split(",");

      let startLat, startLng;

      if (startValue === "current" && gpsLat !== null) {
        startLat = gpsLat;
        startLng = gpsLng;
      } else if (startValue === "current" && gpsLat === null) {
        alert("Önce 'Konumumu Bul' butonuna basmalısınız.");
        return;
      } else {
        const startSplit = startValue.split(",");
        startLat = parseFloat(startSplit[0]);
        startLng = parseFloat(startSplit[1]);
      }

      const endLat = parseFloat(endVal[0]);
      const endLng = parseFloat(endVal[1]);

      if (routingControl !== null) {
        map.removeControl(routingControl);
      }

      // Standart sunucuyu kullanıyoruz, kampüs dışına saçma yollar çizerse diye yaya profiline zorluyoruz
      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(startLat, startLng),
          L.latLng(endLat, endLng)
        ],
        router: L.Routing.osrmv1({
          profile: 'foot'
        }),
        lineOptions: {
          styles: [{color: '#e63946', opacity: 0.9, weight: 6}] 
        },
        createMarker: function() { return null; } 
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const distanceMetres = e.routes[0].summary.totalDistance;
        
        // Gerçekçi yürüme süresi hesaplaması (Ortalama bir insan dakikada 80 metre yürür)
        const realWalkingTimeMin = Math.ceil(distanceMetres / 80); 
        const distKm = (distanceMetres / 1000).toFixed(2);
        
        const infoBox = document.getElementById('routeInfo');
        infoBox.style.display = "block";
        infoBox.innerHTML = `🚶‍♂️ <b>Mesafe:</b> ${distKm} km <br> ⏱️ <b>Gerçekçi Yürüme:</b> ~${realWalkingTimeMin} dk`;
        
        // Paneli kapatıp sağ üstte butonu çıkar
        setTimeout(() => {
          toggleMenu();
        }, 1200);
      });
    }
  </script>
</body>
</html>
