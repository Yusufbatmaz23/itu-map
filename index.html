<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İTÜ Navigasyon - Ayazağa</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    
    #controlPanel {
      position: absolute;
      top: 15px;
      left: 15px; 
      z-index: 1000;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      width: 280px;
      max-height: 85vh;
      overflow-y: auto;
      transition: all 0.3s ease;
    }
    
    #openMenuBtn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: #0033a0;
      color: white;
      font-weight: bold;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #333;
      margin-top: -5px;
      margin-right: -5px;
    }

    /* iPhone (iOS) Safari Engelini Aşan Sarı Menü Kodu */
    select { 
      -webkit-appearance: none; /* iPhone'un beyaz menü dayatmasını kapatır */
      -moz-appearance: none;
      appearance: none;
      width: 100%; 
      padding: 12px; 
      margin-top: 5px; 
      margin-bottom: 15px; 
      border-radius: 6px; 
      border: 2px solid #F9A825; 
      font-size: 15px; 
      background-color: #FBC02D; /* Ana Sarı Renk */
      color: #000; 
      font-weight: bold;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23000%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 10px top 50%;
      background-size: 12px auto;
    }
    
    button.full-width { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 10px; border-radius: 6px; border: none; font-size: 15px; }
    .btn-route { background: #0033a0; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .btn-route:hover { background: #002277; }
    .btn-gps { background: #28a745; color: white; font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .btn-gps:hover { background: #218838; }
    
    #routeInfo {
      display: none;
      background: #e9ecef;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 15px;
      color: #333;
      text-align: center;
      border: 1px solid #ccc;
    }
    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>

  <button id="openMenuBtn" onclick="toggleMenu()">🔍 Rota / Menü</button>

  <div id="controlPanel">
    <button class="close-btn" onclick="toggleMenu()">✖</button>
    <h3 style="margin-top: 0; margin-bottom: 20px; color: #0033a0; text-align: left;">İTÜ Navigasyon</h3>
    
    <button class="btn-gps full-width" onclick="useCurrentLocation()">📍 Konumumu Bul</button>

    <label><b>Neredesin?</b></label>
    <select id="startSelect">
      <optgroup label="Fakülteler & Derslikler">
        <option value="41.1086,29.0255">Uçak ve Uzay Bilimleri Fak.</option>
        <option value="41.1119,29.0229">Yabancı Diller Yüksekokulu (YDY)</option>
        <option value="41.1077,29.0245">Merkezi Derslik (MED)</option>
        <option value="41.1042,29.0198">Elektrik-Elektronik Fak. (EEB)</option>
        <option value="41.1092,29.0225">İnşaat Fakültesi</option>
        <option value="41.1045,29.0225">Bilgisayar ve Bilişim Fak. (BBF)</option>
        <option value="41.1070,29.0230">Fen Edebiyat Fakültesi (FEF)</option>
        <option value="41.1065,29.0260">Kimya Metalurji Fak. (KMF)</option>
        <option value="41.1055,29.0270">Maden Fakültesi</option>
        <option value="41.1060,29.0210">Gemi İnşaatı ve Deniz Bil. Fak.</option>
      </optgroup>
      <optgroup label="Yurtlar">
        <option value="41.1098,29.0195">Gölet Yurtları</option>
        <option value="41.1040,29.0280">Vadi Yurtları</option>
        <option value="41.1035,29.0230">Ayazağa Kız Yurdu</option>
      </optgroup>
      <optgroup label="Sosyal Alanlar & Kütüphane">
        <option value="41.1082,29.0229">Mustafa İnan Kütüphanesi</option>
        <option value="41.1049,29.0210">75. Yıl Öğrenci Merkezi (Yemekhane)</option>
        <option value="41.1085,29.0185">İTÜ Gölet & Kafeler</option>
        <option value="41.1054,29.0234">İTÜ Stadyumu</option>
        <option value="41.1038,29.0258">Süleyman Demirel Kültür Merkezi</option>
      </optgroup>
      <optgroup label="Giriş Kapıları">
        <option value="41.1030,29.0252">Ana Kapı (Metro Çıkışı)</option>
        <option value="41.1080,29.0290">Borsa Kapısı</option>
        <option value="41.1125,29.0240">İstinye Kapısı</option>
      </optgroup>
    </select>

    <label><b>Nereye Gideceksin?</b></label>
    <select id="endSelect">
      <optgroup label="Fakülteler & Derslikler">
        <option value="41.1077,29.0245">Merkezi Derslik (MED)</option>
        <option value="41.1086,29.0255">Uçak ve Uzay Bilimleri Fak.</option>
        <option value="41.1119,29.0229">Yabancı Diller Yüksekokulu (YDY)</option>
        <option value="41.1042,29.0198">Elektrik-Elektronik Fak. (EEB)</option>
        <option value="41.1092,29.0225">İnşaat Fakültesi</option>
        <option value="41.1045,29.0225">Bilgisayar ve Bilişim Fak. (BBF)</option>
        <option value="41.1070,29.0230">Fen Edebiyat Fakültesi (FEF)</option>
        <option value="41.1065,29.0260">Kimya Metalurji Fak. (KMF)</option>
        <option value="41.1055,29.0270">Maden Fakültesi</option>
        <option value="41.1060,29.0210">Gemi İnşaatı ve Deniz Bil. Fak.</option>
      </optgroup>
      <optgroup label="Yurtlar">
        <option value="41.1098,29.0195">Gölet Yurtları</option>
        <option value="41.1040,29.0280">Vadi Yurtları</option>
        <option value="41.1035,29.0230">Ayazağa Kız Yurdu</option>
      </optgroup>
      <optgroup label="Sosyal Alanlar & Kütüphane">
        <option value="41.1082,29.0229">Mustafa İnan Kütüphanesi</option>
        <option value="41.1049,29.0210">75. Yıl Öğrenci Merkezi (Yemekhane)</option>
        <option value="41.1085,29.0185">İTÜ Gölet & Kafeler</option>
        <option value="41.1054,29.0234">İTÜ Stadyumu</option>
        <option value="41.1038,29.0258">Süleyman Demirel Kültür Merkezi</option>
      </optgroup>
      <optgroup label="Giriş Kapıları">
        <option value="41.1030,29.0252">Ana Kapı (Metro Çıkışı)</option>
        <option value="41.1080,29.0290">Borsa Kapısı</option>
        <option value="41.1125,29.0240">İstinye Kapısı</option>
      </optgroup>
    </select>

    <button class="btn-route full-width" onclick="calculateRoute()">Başla (Rotayı Çiz)</button>
    
    <div id="routeInfo"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <script>
    const map = L.map('map').setView([41.1065, 29.0235], 16);

    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    }).addTo(map);

    let routingControl = null;
    let userLocationMarker = null;
    let gpsLat = null;
    let gpsLng = null;
    let watchId = null; 

    function toggleMenu() {
      const panel = document.getElementById("controlPanel");
      const btn = document.getElementById("openMenuBtn");
      
      if (panel.style.display === "none") {
        panel.style.display = "block";
        btn.style.display = "none";
      } else {
        panel.style.display = "none";
        btn.style.display = "block";
      }
    }

    function useCurrentLocation() {
      const infoBox = document.getElementById('routeInfo');
      if (navigator.geolocation) {
        infoBox.style.display = "block";
        infoBox.innerHTML = "⏳ Konumunuz bulunuyor...";
        
        navigator.geolocation.getCurrentPosition(function(position) {
          gpsLat = position.coords.latitude;
          gpsLng = position.coords.longitude;
          
          if(userLocationMarker) { map.removeLayer(userLocationMarker); }
          userLocationMarker = L.circleMarker([gpsLat, gpsLng], {color: '#007bff', radius: 9, fillOpacity: 1, weight: 3, color: 'white'}).addTo(map).bindPopup("Buradasınız!").openPopup();
          map.setView([gpsLat, gpsLng], 17);
          
          let startSelect = document.getElementById("startSelect");
          if(!document.getElementById("currOpt")) {
             let opt = document.createElement('option');
             opt.id = "currOpt";
             opt.value = "current";
             opt.innerHTML = "📍 Anlık Konumum (GPS)";
             startSelect.insertBefore(opt, startSelect.firstChild);
          }
          startSelect.value = "current";
          
          infoBox.innerHTML = "✅ Konum bulundu! Şimdi hedefinizi seçin.";
        }, function(error) {
          infoBox.innerHTML = "❌ Konum alınamadı. Telefonunuzun GPS iznini kontrol edin.";
        }, { enableHighAccuracy: true });
      } else {
        alert("Tarayıcınız konum özelliğini desteklemiyor.");
      }
    }

    function calculateRoute() {
      const startValue = document.getElementById("startSelect").value;
      const endVal = document.getElementById("endSelect").value.split(",");

      let startLat, startLng;

      if (startValue === "current" && gpsLat !== null) {
        startLat = gpsLat;
        startLng = gpsLng;
      } else if (startValue === "current" && gpsLat === null) {
        alert("Önce 'Konumumu Bul' butonuna basmalısınız.");
        return;
      } else {
        const startSplit = startValue.split(",");
        startLat = parseFloat(startSplit[0]);
        startLng = parseFloat(startSplit[1]);
      }

      const endLat = parseFloat(endVal[0]);
      const endLng = parseFloat(endVal[1]);

      if (routingControl !== null) {
        map.removeControl(routingControl);
      }

      // Araba rotasına düşmesini engelleyen KESİN yaya yolları sunucusu ayarı
      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(startLat, startLng),
          L.latLng(endLat, endLng)
        ],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://routing.openstreetmap.de/routed-foot/route/v1',
          profile: 'driving' // Sunucu zaten sadece yaya yollarını barındırdığı için çökmesini engeller
        }),
        lineOptions: {
          styles: [{color: '#e63946', opacity: 0.9, weight: 6}] 
        },
        createMarker: function() { return null; } 
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const distance = e.routes[0].summary.totalDistance; 
        const time = e.routes[0].summary.totalTime; 
        const distKm = (distance / 1000).toFixed(2); 
        const timeMin = Math.round(time / 60); 
        
        const infoBox = document.getElementById('routeInfo');
        infoBox.style.display = "block";
        infoBox.innerHTML = `🚶‍♂️ <b>Mesafe:</b> ${distKm} km <br> ⏱️ <b>Tahmini Yürüme:</b> ~${timeMin} dk`;
        
        setTimeout(() => { toggleMenu(); }, 1200);
      });

      if (startValue === "current" && navigator.geolocation) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        
        watchId = navigator.geolocation.watchPosition(function(position) {
          let currentLat = position.coords.latitude;
          let currentLng = position.coords.longitude;
          
          if(userLocationMarker) {
            userLocationMarker.setLatLng([currentLat, currentLng]);
          }
          map.setView([currentLat, currentLng], 18);
        }, function(error) {
          console.log("Hareket takibi yapılamıyor.");
        }, { enableHighAccuracy: true, maximumAge: 0 });
      }
    }
  </script>
</body>
</html>
